<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>글 수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">

  <div class="mx-auto" style="max-width: 640px;">
    <h1 class="h3 mb-4 fw-bold text-center">✏️ 글 수정</h1>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form action="/board/modify" method="post">
          <!-- 어떤 글을 수정하는지 식별하기 위한 no값 (화면에는 노출하지 않음) -->
          <input type="hidden" name="no" th:value="${board.no}">

          <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" class="form-control" id="title" name="title"
                   th:value="${board.title}" placeholder="제목을 입력하세요" autofocus required>
          </div>

          <div class="mb-4">
            <label for="content" class="form-label">내용</label>
            <textarea class="form-control" id="content" name="content" rows="10"
                      placeholder="내용을 입력하세요" required th:text="${board.content}"></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary w-50" onclick="location.href='/board'">취소</button>
            <button type="submit" class="btn btn-primary w-50">저장하기</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>
</body>
</html>
