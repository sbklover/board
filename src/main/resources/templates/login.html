<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f6f8;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 2.5rem;
            background: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.08);
        }
        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .btn-primary {
            background-color: #2f5bea;
            border-color: #2f5bea;
        }
        .btn-primary:hover {
            background-color: #2447c0;
            border-color: #2447c0;
        }
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 0.25rem;
            color: #6c757d;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .password-toggle:hover {
            color: #2f5bea;
        }
        .password-toggle svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1>로그인</h1>
    <form action="/member" method="post">
        <div class="mb-3">
            <label class="form-label">아이디</label>
            <input type="text" class="form-control" id="id" name="id" placeholder="아이디를 입력하세요" autofocus required>
        </div>
        <div class="mb-4">
            <label class="form-label">비밀번호</label>
            <div class="password-wrapper">
                <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                <button type="button" class="password-toggle" id="togglePassword" aria-label="비밀번호 보기">
                    <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <div th:if="${error}" th:text="${error}" style="color: red;"></div>

        <br>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>
    <div class="text-center mt-3">
        <span class="text-muted small">계정이 없으신가요?</span>
        <a href="/register" class="small text-decoration-none">회원 가입</a>
    </div>
</div>

<script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    const eyeOpen = `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>`;
    const eyeClosed = `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

    toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.innerHTML = isPassword ? eyeClosed : eyeOpen;
        toggleBtn.setAttribute('aria-label', isPassword ? '비밀번호 숨기기' : '비밀번호 보기');
    });
</script>

</body>
</html>
