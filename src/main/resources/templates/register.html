<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 가입</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f6f8;
            padding: 2rem 1rem;
        }
        .signup-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.08);
        }
        .signup-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .btn-primary {
            background-color: #2f5bea;
            border-color: #2f5bea;
        }
        .btn-primary:hover {
            background-color: #2447c0;
            border-color: #2447c0;
        }
        .btn-primary:disabled {
            background-color: #a9b7e8;
            border-color: #a9b7e8;
        }
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 0.25rem;
            color: #6c757d;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .password-toggle:hover {
            color: #2f5bea;
        }
        .password-toggle svg {
            width: 20px;
            height: 20px;
        }
        .form-text.error {
            color: #dc3545;
        }
        .form-text.success {
            color: #198754;
        }
    </style>
</head>
<body>

<div class="signup-card">
    <h1>회원 가입</h1>

    <form action="/register" method="post" id="signupForm">
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" class="form-control" id="username" name="id" th:value="${member != null ? member.id : ''}" placeholder="아이디를 입력하세요" autofocus required>
            <div id="idCheckMsg" class="form-text"></div>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${member != null ? member.name : ''}" placeholder="이름을 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <div class="password-wrapper">
                <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                <button type="button" class="password-toggle" id="togglePassword" aria-label="비밀번호 보기">
                    <svg class="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <div class="mb-3">
            <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
            <div class="password-wrapper">
                <!-- 확인용 필드는 서버로 보낼 필요 없으니 name 없이 그대로 둡니다 -->
                <input type="password" class="form-control" id="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required>
                <button type="button" class="password-toggle" id="togglePasswordConfirm" aria-label="비밀번호 보기">
                    <svg class="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <div id="passwordMatchMsg" class="form-text"></div>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2" role="alert" th:text="${error}"></div>

        <br>
        <button type="submit" class="btn btn-primary w-100" id="submitBtn" disabled>가입하기</button>
        <br>
    </form>

    <div class="text-center mt-3">
        <span class="text-muted small">이미 계정이 있으신가요?</span>
        <a href="/" class="small text-decoration-none">로그인</a>
    </div>
</div>


<script>
    // 눈 모양 아이콘 (열림/닫힘)
    const eyeOpen = `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>`;
    const eyeClosed = `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

    // 비밀번호 보기/숨기기 토글 (공통 함수)
    function setupToggle(toggleBtnId, inputId) {
        const toggleBtn = document.getElementById(toggleBtnId);
        const input = document.getElementById(inputId);
        const eyeIcon = toggleBtn.querySelector('.eyeIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword ? eyeClosed : eyeOpen;
            toggleBtn.setAttribute('aria-label', isPassword ? '비밀번호 숨기기' : '비밀번호 보기');
        });
    }
    setupToggle('togglePassword', 'password');
    setupToggle('togglePasswordConfirm', 'passwordConfirm');

    // 폼 요소 참조
    const usernameInput = document.getElementById('username');
    const nameInput = document.getElementById('name');
    const passwordInput = document.getElementById('password');
    const passwordConfirmInput = document.getElementById('passwordConfirm');
    const submitBtn = document.getElementById('submitBtn');
    const passwordMatchMsg = document.getElementById('passwordMatchMsg');
    const idCheckMsg = document.getElementById('idCheckMsg');

    // 아이디 중복 확인 상태 (null: 미확인, true: 사용가능, false: 이미 존재)
    let idAvailable = null;
    let idCheckTimer = null;

    async function checkIdDuplicate() {
        const id = usernameInput.value.trim();

        if (id.length === 0) {
            idAvailable = null;
            idCheckMsg.textContent = '';
            idCheckMsg.classList.remove('error', 'success');
            checkFormValid();
            return;
        }

        try {
            const res = await fetch(`/check-id?id=${encodeURIComponent(id)}`);
            const data = await res.json();

            if (data.exists) {
                idAvailable = false;
                idCheckMsg.textContent = '이미 아이디가 있습니다.';
                idCheckMsg.classList.remove('success');
                idCheckMsg.classList.add('error');
            } else {
                idAvailable = true;
                idCheckMsg.textContent = '사용 가능한 아이디입니다.';
                idCheckMsg.classList.remove('error');
                idCheckMsg.classList.add('success');
            }
        } catch (err) {
            // 네트워크 오류 시에는 서버 최종 검증에 맡기고 클라이언트에서는 막지 않음
            idAvailable = null;
            idCheckMsg.textContent = '';
        }

        checkFormValid();
    }

    // 입력 중에는 매 타이핑마다 요청하지 않도록 디바운스 처리 (400ms)
    usernameInput.addEventListener('input', () => {
        idAvailable = null; // 재입력 중에는 이전 확인 결과 무효화
        idCheckMsg.textContent = '확인 중...';
        idCheckMsg.classList.remove('error', 'success');

        clearTimeout(idCheckTimer);
        idCheckTimer = setTimeout(checkIdDuplicate, 400);
    });

    // 숫자, 영문, 특수문자만 입력 가능 (비밀번호 필드 전용)
    const allowedPattern = /[^A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/g;
    function restrictPasswordInput(inputId) {
        const input = document.getElementById(inputId);
        input.addEventListener('input', (e) => {
            const filtered = e.target.value.replace(allowedPattern, '');
            if (filtered !== e.target.value) {
                e.target.value = filtered;
            }
            checkFormValid();
        });
    }
    restrictPasswordInput('password');
    restrictPasswordInput('passwordConfirm');

    // 이름 입력에도 유효성 검사 연결 (아이디는 위에서 중복확인과 함께 별도 처리)
    nameInput.addEventListener('input', checkFormValid);

    // 엔터키 입력 시 다음 항목으로 이동
    const focusOrder = ['username', 'name', 'password', 'passwordConfirm'];
    focusOrder.forEach((id, idx) => {
        const el = document.getElementById(id);
        el.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            e.preventDefault();

            const nextId = focusOrder[idx + 1];
            if (nextId) {
                document.getElementById(nextId).focus();
            } else if (!submitBtn.disabled) {
                submitBtn.focus();
                submitBtn.click();
            }
        });
    });

    // 전체 폼 유효성 검사: 모든 필드 입력 + 비밀번호 일치 시에만 버튼 활성화
    function checkFormValid() {
        const username = usernameInput.value.trim();
        const name = nameInput.value.trim();
        const password = passwordInput.value;
        const passwordConfirm = passwordConfirmInput.value;

        // 비밀번호 일치 여부 메시지 표시
        if (passwordConfirm.length === 0) {
            passwordMatchMsg.textContent = '';
            passwordMatchMsg.classList.remove('error', 'success');
        } else if (password === passwordConfirm) {
            passwordMatchMsg.textContent = '비밀번호가 일치합니다.';
            passwordMatchMsg.classList.remove('error');
            passwordMatchMsg.classList.add('success');
        } else {
            passwordMatchMsg.textContent = '비밀번호가 일치하지 않습니다.';
            passwordMatchMsg.classList.remove('success');
            passwordMatchMsg.classList.add('error');
        }

        // 모든 필드가 채워지고, 비밀번호가 일치하고, 아이디 중복확인까지 통과해야 버튼 활성화
        const allFilled = username.length > 0 && name.length > 0 && password.length > 0 && passwordConfirm.length > 0;
        const passwordMatch = password === passwordConfirm;

        submitBtn.disabled = !(allFilled && passwordMatch && idAvailable === true);
    }

    // 제출 직전 최종 안전장치 (더블 체크)
    document.getElementById('signupForm').addEventListener('submit', (e) => {
        const password = passwordInput.value;
        const passwordConfirm = passwordConfirmInput.value;
        if (password !== passwordConfirm) {
            e.preventDefault();
        }
    });
</script>

</body>
</html>
