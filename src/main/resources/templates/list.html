<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>블로그 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 10px 4px 4px;
            border-radius: 20px;
            border: none;
            background: #fff;
        }
        .user-chip:hover {
            background: #f2f3f7;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2d5cf6;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .user-chip .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #20232f;
            line-height: 1.2;
        }
        .user-chip .bi-chevron-down {
            font-size: 11px;
            color: #8a8d99;
        }
        .user-chip.dropdown-toggle::after {
            display: none;
        }
    </style>
</head>

<body class="bg-light">
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 fw-bold">📋 게시글 목록</h1>

        <div class="dropdown">
            <button class="user-chip dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false" style="border:none;">
                <div class="user-avatar" th:text="${#strings.substring(name,0,1)}">U</div>
                <span class="user-name" th:text="${name}">사용자</span>
                <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li>
                    <a class="dropdown-item" href="/logout"
                       onclick="return confirm('로그아웃 하시겠습니까?');">
                        <i class="bi bi-box-arrow-right me-2"></i>로그아웃
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="text-center" style="width: 80px;">번호</th>
                    <th>제목</th>
                    <th>내용</th>
                    <th class="text-center" style="width: 100px;">수정</th>
                    <th class="text-center" style="width: 100px;">삭제</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="p : ${boardList}">
                    <td class="text-center" th:text="${p.no}"></td>
                    <td th:text="${p.title}"></td>
                    <td class="text-truncate" style="max-width: 300px;" th:text="${p.content}"></td>
                    <td class="text-center">
                        <a th:href="@{'/board/modify/' + ${p.no}}" class="btn btn-sm btn-outline-secondary">
                            수정
                        </a>
                    </td>
                    <td class="text-center">
                        <a th:href="@{'/board/delete/' + ${p.no}}"
                           th:attr="onclick=|return confirm('${p.no}번을 삭제하시겠습니까?');|"
                           class="btn btn-sm btn-outline-danger">
                            삭제
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(boardList)}">
                    <td colspan="5" class="text-center text-muted py-4">등록된 게시글이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4">
        <div style="width: 100px;"></div>

        <!-- 페이징: 10개 단위로 페이지 그룹을 나눠 보여줌 -->
        <nav aria-label="Page navigation" th:if="${totalPages > 0}"
             th:with="pageGroupSize=10,
                               startPage=${(currentPage / pageGroupSize) * pageGroupSize},
                               endPage=${(startPage + pageGroupSize - 1) < (totalPages - 1) ? (startPage + pageGroupSize - 1) : (totalPages - 1)}">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:if="${startPage > 0}">
                    <a class="page-link" th:href="@{/board(page=${startPage - pageGroupSize})}"><</a>
                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(startPage, endPage)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/board(page=${i})}" th:text="${i + 1}"></a>
                </li>

                <li class="page-item" th:if="${(startPage + pageGroupSize) < totalPages}">
                    <a class="page-link" th:href="@{/board(page=${startPage + pageGroupSize})}">></a>
                </li>
            </ul>
        </nav>

        <a href="/board/new" class="btn btn-primary" style="width: 100px; text-align: center;">
            <i class="bi"></i> 새 글쓰기
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
