<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글 조회</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    input[readonly], textarea[readonly] {
      background-color: #e9ecef;
      caret-color: transparent;
    }
  </style>
</head>

<body class="bg-light">
<div class="container py-5">

  <div class="mx-auto" style="max-width: 640px;">
    <h1 class="h3 mb-4 fw-bold text-center">📄 글 조회</h1>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="mb-3">
          <label for="no" class="form-label">번호</label>
          <input type="text" class="form-control" id="no" name="no"
                 th:value="${board.no}" readonly tabindex="-1">
        </div>

        <div class="mb-3">
          <label for="title" class="form-label">제목</label>
          <input type="text" class="form-control" id="title" name="title"
                 th:value="${board.title}" readonly tabindex="-1">
        </div>

        <div class="mb-4">
          <label for="content" class="form-label">내용</label>
          <textarea class="form-control" id="content" name="content" rows="10"
                    readonly tabindex="-1" th:text="${board.content}"></textarea>
        </div>

        <div class="d-flex gap-2">
          <a href="/board" class="btn btn-outline-secondary flex-fill">
            <i class="bi bi-list-ul me-1"></i> 목록으로
          </a>
          <a th:href="@{'/board/modify/' + ${board.no}}" class="btn btn-outline-primary flex-fill">
            <i class="bi bi-pencil me-1"></i> 수정
          </a>
          <a th:href="@{'/board/delete/' + ${board.no}}"
             th:attr="onclick=|return confirm('${board.no}번을 삭제하시겠습니까?');|"
             class="btn btn-outline-danger flex-fill">
            <i class="bi bi-trash me-1"></i> 삭제
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
