<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 글쓰기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
<div class="container py-5">

  <div class="mx-auto" style="max-width: 640px;">
    <h1 class="h3 mb-4 fw-bold text-center">✏️ 새 글쓰기</h1>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form action="/board/new" method="post">
          <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            new.html
          </div>

          <div class="mb-4">
            <label for="content" class="form-label">내용</label>
            <textarea class="form-control" id="content" name="content" rows="10" placeholder="내용을 입력하세요" required></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary w-50" onclick="history.back()">취소</button>
            <button type="submit" class="btn btn-primary w-50">저장하기</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
